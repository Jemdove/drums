<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- two short drumsticks crossing above the drum -->
  <g stroke-linecap="round">
    <line x1="13" y1="6" x2="31" y2="25" stroke="#283149" stroke-width="9"/>
    <line x1="51" y1="6" x2="33" y2="25" stroke="#283149" stroke-width="9"/>
    <line x1="13" y1="6" x2="31" y2="25" stroke="#f2c38b" stroke-width="5"/>
    <line x1="51" y1="6" x2="33" y2="25" stroke="#f2c38b" stroke-width="5"/>
  </g>

  <!-- drum body (the game's pink) -->
  <path d="M3 27 V51 A29 9 0 0 0 61 51 V27 Z" fill="#DA0463" stroke="#283149" stroke-width="3" stroke-linejoin="round"/>

  <!-- zig-zag lacing -->
  <polyline points="7,32 16,54 25,34 32,57 39,34 48,54 57,32" fill="none" stroke="#DBEDF3" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- drum top (skin) -->
  <ellipse cx="32" cy="27" rx="29" ry="9" fill="#DBEDF3" stroke="#283149" stroke-width="3"/>
</svg>
